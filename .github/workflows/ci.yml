name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  postgres-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python scripts/lab-db.py start
      - run: python -m unittest discover -s tests -v
      - run: python -m faultline.cli run --output artifacts/ci --seeds 17
      - if: always()
        run: python scripts/lab-db.py stop
