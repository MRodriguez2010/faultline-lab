[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline-lab"
version = "0.1.0"
readme = "README.md"
license = "MIT"
authors = [{name = "Miguel Rodriguez"}]
description = "A reproducible business-data failure and recovery lab"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]==3.3.5"]

[project.scripts]
faultline = "faultline.cli:main"

[tool.setuptools.packages.find]
include = ["faultline*"]
